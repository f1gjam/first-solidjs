<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#f3f4f6"/>
  
  <!-- Date picker container -->
  <rect x="150" y="100" width="300" height="200" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="150" y="100" width="300" height="50" rx="8" fill="#1f2937"/>
  <rect x="150" y="125" width="300" height="25"/>
  <text x="300" y="132" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">
    Select Date
  </text>
  
  <!-- Month/Year selector -->
  <rect x="170" y="170" width="260" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="210" y="196" font-family="Arial" font-size="14" fill="#111827">
    December 2024
  </text>
  <path d="M 410 185 L 415 190 L 410 195" stroke="#6b7280" stroke-width="2" fill="none"/>
  
  <!-- Previous/Next buttons -->
  <circle cx="190" cy="190" r="15" fill="#3b82f6"/>
  <path d="M 195 190 L 188 190 M 188 190 L 191 187 M 188 190 L 191 193" stroke="#ffffff" stroke-width="2"/>
  
  <circle cx="410" cy="190" r="15" fill="#3b82f6"/>
  <path d="M 405 190 L 412 190 M 412 190 L 409 187 M 412 190 L 409 193" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Sample dates -->
  <text x="200" y="245" font-family="Arial" font-size="12" fill="#6b7280">
    Mon  Tue  Wed  Thu  Fri  Sat  Sun
  </text>
  
  <!-- Highlighted date -->
  <circle cx="230" cy="270" r="16" fill="#3b82f6"/>
  <text x="230" y="275" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">
    15
  </text>
  
  <!-- Other dates -->
  <text x="260" y="275" font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">16</text>
  <text x="290" y="275" font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">17</text>
  <text x="320" y="275" font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">18</text>
  <text x="350" y="275" font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">19</text>
  <text x="380" y="275" font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">20</text>
  <text x="410" y="275" font-family="Arial" font-size="12" fill="#111827" text-anchor="middle">21</text>
  
  <!-- Instruction text -->
  <text x="300" y="340" font-family="Arial" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">
    Use arrow buttons or click a date
  </text>
  <text x="300" y="360" font-family="Arial" font-size="12" fill="#6b7280" text-anchor="middle">
    Leaderboard updates automatically
  </text>
</svg>
