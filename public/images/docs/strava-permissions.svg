<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Browser chrome -->
  <rect width="800" height="40" fill="#e5e7eb"/>
  <text x="100" y="27" font-family="Arial" font-size="14" fill="#6b7280">
    strava.com/oauth/authorize
  </text>
  
  <!-- Strava Header -->
  <rect y="40" width="800" height="60" fill="#fc4c02"/>
  <text x="400" y="78" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">
    STRAVA
  </text>
  
  <!-- Main content -->
  <rect y="100" width="800" height="500" fill="#f9fafb"/>
  
  <!-- Card -->
  <rect x="200" y="140" width="400" height="400" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="180" font-family="Arial" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">
    Authorize Strava Club Stats
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="210" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">
    This app would like to:
  </text>
  
  <!-- Checkboxes -->
  <!-- Checkbox 1 -->
  <rect x="220" y="240" width="20" height="20" rx="3" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <path d="M 224 250 L 228 254 L 236 244" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="250" y="256" font-family="Arial" font-size="14" fill="#111827">
    View data about your activities
  </text>
  
  <!-- Checkbox 2 -->
  <rect x="220" y="280" width="20" height="20" rx="3" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <path d="M 224 290 L 228 294 L 236 284" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="250" y="296" font-family="Arial" font-size="14" fill="#111827">
    View data about your private activities
  </text>
  
  <!-- Checkbox 3 -->
  <rect x="220" y="320" width="20" height="20" rx="3" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <path d="M 224 330 L 228 334 L 236 324" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="250" y="336" font-family="Arial" font-size="14" fill="#111827">
    View your profile information
  </text>
  
  <!-- Warning box -->
  <rect x="220" y="370" width="360" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="395" font-family="Arial" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold">
    ⚠️ IMPORTANT
  </text>
  <text x="400" y="415" font-family="Arial" font-size="12" fill="#92400e" text-anchor="middle">
    Make sure ALL checkboxes are ticked
  </text>
  <text x="400" y="432" font-family="Arial" font-size="12" fill="#92400e" text-anchor="middle">
    or registration will fail
  </text>
  
  <!-- Authorize button -->
  <rect x="300" y="470" width="200" height="45" rx="6" fill="#fc4c02"/>
  <text x="400" y="498" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">
    Authorize
  </text>
</svg>
