<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" fill="none">
  <!-- Background -->
  <rect width="1000" height="600" fill="#f9fafb"/>
  
  <!-- Header -->
  <rect width="1000" height="100" fill="#1f2937"/>
  <text x="500" y="45" font-family="Arial" font-size="20" fill="#fbbf24" text-anchor="middle" font-weight="bold">
    LEADERBOARD - CURRENTLY IN BETA TESTING
  </text>
  <text x="500" y="75" font-family="Arial" font-size="18" fill="#ffffff" text-anchor="middle">
    Men's Cycling Monthly - December 2024
  </text>
  
  <!-- Table -->
  <rect x="50" y="130" width="900" height="450" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Table Header -->
  <rect x="50" y="130" width="900" height="50" fill="#f3f4f6"/>
  <text x="100" y="162" font-family="Arial" font-size="14" fill="#111827" font-weight="bold">Rank</text>
  <text x="200" y="162" font-family="Arial" font-size="14" fill="#111827" font-weight="bold">Name</text>
  <text x="450" y="162" font-family="Arial" font-size="14" fill="#111827" font-weight="bold">Total Distance</text>
  <text x="630" y="162" font-family="Arial" font-size="14" fill="#111827" font-weight="bold">Outdoor</text>
  <text x="770" y="162" font-family="Arial" font-size="14" fill="#111827" font-weight="bold">Elevation</text>
  
  <!-- Row 1 -->
  <rect x="50" y="180" width="900" height="45" fill="#fef3c7"/>
  <text x="100" y="207" font-family="Arial" font-size="16" fill="#111827" font-weight="bold">🥇 1</text>
  <text x="200" y="207" font-family="Arial" font-size="14" fill="#111827">John Smith</text>
  <text x="450" y="207" font-family="Arial" font-size="14" fill="#111827">542.3 km</text>
  <text x="630" y="207" font-family="Arial" font-size="14" fill="#111827">485.2 km</text>
  <text x="770" y="207" font-family="Arial" font-size="14" fill="#111827">8,234 m</text>
  
  <!-- Row 2 -->
  <rect x="50" y="225" width="900" height="45" fill="#f3f4f6"/>
  <text x="100" y="252" font-family="Arial" font-size="16" fill="#111827" font-weight="bold">🥈 2</text>
  <text x="200" y="252" font-family="Arial" font-size="14" fill="#111827">Jane Doe</text>
  <text x="450" y="252" font-family="Arial" font-size="14" fill="#111827">487.6 km</text>
  <text x="630" y="252" font-family="Arial" font-size="14" fill="#111827">412.3 km</text>
  <text x="770" y="252" font-family="Arial" font-size="14" fill="#111827">6,892 m</text>
  
  <!-- Row 3 -->
  <rect x="50" y="270" width="900" height="45" fill="#ffffff"/>
  <text x="100" y="297" font-family="Arial" font-size="16" fill="#111827" font-weight="bold">🥉 3</text>
  <text x="200" y="297" font-family="Arial" font-size="14" fill="#111827">Mike Johnson</text>
  <text x="450" y="297" font-family="Arial" font-size="14" fill="#111827">423.1 km</text>
  <text x="630" y="297" font-family="Arial" font-size="14" fill="#111827">398.7 km</text>
  <text x="770" y="297" font-family="Arial" font-size="14" fill="#111827">5,567 m</text>
  
  <!-- Row 4 -->
  <rect x="50" y="315" width="900" height="45" fill="#f3f4f6"/>
  <text x="100" y="342" font-family="Arial" font-size="14" fill="#111827">4</text>
  <text x="200" y="342" font-family="Arial" font-size="14" fill="#6b7280">Sarah Williams</text>
  <text x="450" y="342" font-family="Arial" font-size="14" fill="#6b7280">381.9 km</text>
  <text x="630" y="342" font-family="Arial" font-size="14" fill="#6b7280">356.4 km</text>
  <text x="770" y="342" font-family="Arial" font-size="14" fill="#6b7280">4,923 m</text>
  
  <!-- Row 5 -->
  <rect x="50" y="360" width="900" height="45" fill="#ffffff"/>
  <text x="100" y="387" font-family="Arial" font-size="14" fill="#111827">5</text>
  <text x="200" y="387" font-family="Arial" font-size="14" fill="#6b7280">Tom Brown</text>
  <text x="450" y="387" font-family="Arial" font-size="14" fill="#6b7280">345.7 km</text>
  <text x="630" y="387" font-family="Arial" font-size="14" fill="#6b7280">312.5 km</text>
  <text x="770" y="387" font-family="Arial" font-size="14" fill="#6b7280">4,156 m</text>
  
  <!-- Pagination -->
  <rect x="50" y="540" width="900" height="40" fill="#f3f4f6"/>
  <text x="500" y="565" font-family="Arial" font-size="14" fill="#6b7280" text-anchor="middle">
    Showing 1-5 of 42 athletes • Page 1 of 9
  </text>
  
  <!-- Features callout -->
  <rect x="720" y="420" width="250" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="845" y="445" font-family="Arial" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="bold">
    Table Features:
  </text>
  <text x="845" y="465" font-family="Arial" font-size="11" fill="#1e40af" text-anchor="middle">
    ✓ Click headers to sort
  </text>
  <text x="845" y="482" font-family="Arial" font-size="11" fill="#1e40af" text-anchor="middle">
    ✓ Filter by name
  </text>
  <text x="845" y="499" font-family="Arial" font-size="11" fill="#1e40af" text-anchor="middle">
    ✓ Responsive on mobile
  </text>
</svg>
